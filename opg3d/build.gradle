plugins {
    id 'com.android.library'
}

// Config arrives as gradle properties (NOT via gradle.properties — that file
// is committed to git):
//   CI:    env ORG_GRADLE_PROJECT_PHOTON_APP_ID=... (GitHub Secrets)
//   Local: gradle :opg3d:assembleRelease -PPHOTON_APP_ID=... etc.
def photonAppId = providers.gradleProperty('PHOTON_APP_ID').orElse('').get()
def photonMode = providers.gradleProperty('PHOTON_MODE').orElse('cloud').get()
def photonAddr = providers.gradleProperty('PHOTON_SERVER_ADDRESS').orElse('').get()
def photonPort = providers.gradleProperty('PHOTON_SERVER_PORT').orElse('5055').get()
// CMake 4.1.2 is the version this port is built and verified with. GHA runners
// ship 3.31.5 in the SDK image, so the workflow installs 4.1.2 through
// sdkmanager before building. Override with -PCMAKE_VERSION=<installed> if a
// machine has a different one.
def cmakeVersion = providers.gradleProperty('CMAKE_VERSION').orElse('4.1.2').get()

android {
    namespace 'com.opg3d.redirect'
    compileSdk 35
    ndkVersion '27.3.13750724'   // default NDK on GHA runners

    defaultConfig {
        minSdk 21
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                targets 'opg3d'
                arguments "-DPHOTON_APP_ID=${photonAppId}".toString(),
                        "-DPHOTON_MODE=${photonMode}".toString(),
                        "-DPHOTON_SERVER_ADDRESS=${photonAddr}".toString(),
                        "-DPHOTON_SERVER_PORT=${photonPort}".toString()
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version cmakeVersion   // 3.31.5 is preinstalled in the SDK on GHA runners
        }
    }
}
