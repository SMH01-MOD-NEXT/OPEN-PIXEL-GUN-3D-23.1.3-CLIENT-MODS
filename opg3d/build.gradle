plugins {
    id 'com.android.library'
}

// Build configuration arrives as Gradle properties. The PUN AppID itself is
// never compiled in; the backend supplies it in an authenticated envelope.
def appIdKey = providers.gradleProperty('OPG3D_APPID_KEY').orElse('').get()
def defaultServer = providers.gradleProperty('OPG3D_DEFAULT_SERVER').orElse('').get()
def diagnostics = providers.gradleProperty('OPG3D_DIAGNOSTICS')
        .orElse('false').get().toBoolean() ? '1' : '0'
// CMake 4.1.2 is the version this port is built and verified with. GHA runners
// ship 3.31.5 in the SDK image, so the workflow installs 4.1.2 through
// sdkmanager before building. Override with -PCMAKE_VERSION=<installed> if a
// machine has a different one.
def cmakeVersion = providers.gradleProperty('CMAKE_VERSION').orElse('4.1.2').get()

android {
    namespace 'com.opg3d.redirect'
    compileSdk 36
    ndkVersion '29.0.14206865'   // NDK r29 — newest installed

    defaultConfig {
        minSdk 21
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                targets 'opg3d'
                arguments "-DOPG3D_APPID_KEY=${appIdKey}".toString(),
                        "-DOPG3D_DEFAULT_SERVER=${defaultServer}".toString(),
                        "-DOPG3D_DIAGNOSTICS=${diagnostics}".toString()
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version cmakeVersion   // 3.31.5 is preinstalled in the SDK on GHA runners
        }
    }
}

// Every build drops the library where it is actually used from:
//
//   <project root>/lib/arm64-v8a/libopg3d.so            stripped, goes in the APK
//   <project root>/lib/arm64-v8a/libopg3d.unstripped.so  keep for symbolize_log.py
//
// That mirrors the APK layout, so repacking is a plain copy into lib/arm64-v8a
// with no digging through build/intermediates. The directory is gitignored.
def exportDir = rootProject.layout.projectDirectory.dir('lib/arm64-v8a')

androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.name
        def cap = name.capitalize()
        def merged = layout.buildDirectory
                .dir("intermediates/merged_native_libs/${name}/merge${cap}NativeLibs/out/lib/arm64-v8a")
        def stripped = layout.buildDirectory
                .dir("intermediates/stripped_native_libs/${name}/strip${cap}DebugSymbols/out/lib/arm64-v8a")

        def export = tasks.register("export${cap}NativeLib", Copy) {
            description = "Copies the ${name} libopg3d.so into <root>/lib/arm64-v8a"
            group = 'build'
            // The unstripped build has debug symbols; it is renamed so it can sit
            // next to the shipping one instead of overwriting it.
            from(merged) {
                include '*.so'
                rename '(.*)\\.so', '$1.unstripped.so'
            }
            from(stripped) {
                include '*.so'
            }
            into exportDir
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
            doLast {
                logger.lifecycle("libopg3d.so -> ${exportDir.asFile.absolutePath}")
            }
        }

        tasks.matching { it.name == "assemble${cap}" }.configureEach {
            finalizedBy export
        }
    }
}
