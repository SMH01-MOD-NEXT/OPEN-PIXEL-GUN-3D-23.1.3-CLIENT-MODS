<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Open Pixel Gun</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080e1b;color:#e8efff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(16px,4vw,52px);background:radial-gradient(ellipse at 90% 0,#143b55 0,transparent 55%),radial-gradient(ellipse at 0 100%,#252044 0,transparent 50%)}main{max-width:1060px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-weight:850;letter-spacing:-1px;font-size:clamp(22px,4vw,34px)}.brand em{color:#71edcb;font-style:normal}.tag,.badge{border:1px solid #31425a;border-radius:30px;padding:7px 12px;font-size:12px;color:#9aafcb}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.panel{background:#111c2dd9;border:1px solid #2b3e56;border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:0 18px 50px #0004}h1{font-size:clamp(25px,4vw,40px);line-height:1.15;margin:0 0 12px}h2{font-size:18px;margin:0 0 18px}.muted{color:#9eb0c8;font-size:14px;line-height:1.6}#servers{display:grid;gap:10px;max-height:42vh;overflow:auto}.server{display:block;width:100%;text-align:left;background:#15243a;border:1px solid #30435b;border-radius:15px;padding:16px;cursor:pointer;color:#e8efff}.server.selected{border-color:#71edcb;background:#153b3c}.server strong{font-size:16px;display:block}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:#a8bed7}.good{color:#71edcb}.bad{color:#ffad9d}.row{display:flex;gap:10px;align-items:center}input{min-width:0;width:100%;font-size:16px;padding:14px;border:1px solid #3b506c;border-radius:12px;background:#0b1423;color:white;outline:none}input:focus{border-color:#71edcb}#port{max-width:110px}button{font:inherit}button.action{border:0;border-radius:12px;padding:14px 18px;font-weight:750;background:#243c58;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}#play{width:100%;background:#71edcb;color:#082a25;font-size:19px;padding:17px;margin-top:18px}label{font-size:12px;display:block;color:#a8bed7;margin:18px 0 8px}.note{font-size:12px;color:#8299b6;line-height:1.6;margin-top:20px}#message{min-height:42px;margin-top:16px;font-size:14px;line-height:1.5}progress{width:100%;height:7px;accent-color:#71edcb}footer{display:flex;justify-content:space-between;gap:12px;color:#7289a7;font-size:11px;margin-top:20px}#scan{font-size:12px;padding:8px 12px} @media(max-width:700px){.grid{grid-template-columns:1fr}#servers{max-height:32vh}header{margin-bottom:16px}.tag{display:none}footer{flex-wrap:wrap}}@media(max-height:500px) and (min-width:701px){body{padding:14px 24px}.panel{padding:18px}header{margin-bottom:12px}h1{font-size:26px}#servers{max-height:33vh}.note{margin-top:10px}label{margin-top:10px}#play{margin-top:10px;padding:12px}}
@media(orientation:landscape) and (max-height:600px){body{padding:12px 24px}header{margin-bottom:12px}.panel{padding:16px}h1{font-size:24px;margin-bottom:6px}.muted{display:none}label{margin:10px 0 6px}input{padding:10px}#check{padding:10px}#message{min-height:20px;margin-top:8px;font-size:12px}#play{margin-top:8px;padding:12px}.note{font-size:11px;line-height:1.35;margin-top:10px}footer{margin-top:10px}}</style><main><header><div class="brand">OPEN <em>PIXEL GUN</em></div><span class="tag" data-t="native"></span></header><div class="grid"><section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:18px"><h2 style="margin:0" data-t="servers"></h2><button class="action" id="scan" data-t="scan"></button></div><div id="servers"></div><div class="note" data-t="saved"></div></section><section class="panel"><h1 data-t="title"></h1><div class="muted" data-t="intro"></div><label for="host" data-t="address"></label><div class="row"><input id="host" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.10"><input id="port" inputmode="numeric" value="8080" aria-label="Port"></div><button class="action" id="check" style="width:100%;margin-top:10px" data-t="check"></button><div id="message" role="status" aria-live="polite"></div><progress id="progress" max="100" value="0" hidden></progress><button class="action" id="play" disabled data-t="play"></button><div class="note" data-t="security"></div></section></div><footer><span>23.1.3 · arm64-v8a</span><span data-t="footer"></span></footer></main><script>
const T={ru:{native:'Нативный лоадер',official:'Официальный',servers:'Подключения',scan:'Обновить',saved:'Сохранённые адреса проверяются при каждом запуске. Серверы в вашей сети добавляются автоматически.',title:'Выберите свой сервер',intro:'Подключитесь к бэкэнду, затем запустите игру. Версия клиента и обновления проверяются автоматически.',address:'Адрес сервера и порт',check:'Проверить подключение',play:'Играть',security:'Библиотека проверяется по цифровой подписи перед запуском. Скачивание выполняется только при необходимости.',footer:'Неофициальный клиент · серверное управление обновлениями',empty:'Ищем сохранённые и локальные серверы…',match:'Совместим',mismatch:'Несовместим',unknown:'Страна не указана',offline:'Сервер недоступен'},en:{native:'Native launcher',official:'Official',servers:'Connections',scan:'Refresh',saved:'Saved addresses are checked on every launch. LAN servers are added automatically.',title:'Choose your server',intro:'Connect to a backend, then launch the game. Client compatibility and updates are checked automatically.',address:'Server address and port',check:'Check connection',play:'Play',security:'Digital signatures are verified before loading. The library is downloaded only when needed.',footer:'Unofficial client · server-managed updates',empty:'Checking saved and local servers…',match:'Compatible',mismatch:'Incompatible',unknown:'Country not specified',offline:'Server unavailable'}};let lang=navigator.language.startsWith('ru')?'ru':'en',t=T[lang],selected='',last='';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);const $=id=>document.getElementById(id);async function action(path,body=''){try{const r=await fetch(path,{method:'POST',body});if(!r.ok)throw Error(r.status);await poll()}catch(e){$('message').textContent=t.offline}}$('check').onclick=()=>action('probe',$('host').value.trim()+':'+$('port').value.trim());$('scan').onclick=()=>action('scan');$('play').onclick=()=>action('play',selected);function region(code){if(code==='Local')return 'Local';if(code==='ZZ')return t.unknown;try{return new Intl.DisplayNames([lang],{type:'region'}).of(code)}catch(e){return code}}async function poll(){try{const s=await(await fetch('status',{cache:'no-store'})).json();$('message').textContent=s.message;$('progress').hidden=!s.busy;$('progress').value=s.percent;$('check').disabled=s.busy;$('scan').disabled=s.busy;if(!selected&&s.servers.some(x=>x.compatible))selected=(s.servers.find(x=>x.compatible&&x.endpoint===s.preferred)||s.servers.find(x=>x.compatible)).endpoint;const key=JSON.stringify([s.servers,selected]);if(key!==last){last=key;$('servers').replaceChildren();for(const v of s.servers){const b=document.createElement('button');b.className='server'+(v.endpoint===selected?' selected':'');const strong=document.createElement('strong');strong.textContent=(v.name||v.endpoint)+(v.official?' · '+t.official:'');b.append(strong);const meta=document.createElement('div');meta.className='meta';for(const text of [v.endpoint,region(v.country),v.online?(v.version+' · '+(v.compatible?t.match:t.mismatch)):t.offline]){const span=document.createElement('span');span.textContent=text;meta.append(span)}b.append(meta);b.onclick=()=>{selected=v.endpoint;poll()};$('servers').append(b)}if(!s.servers.length)$('servers').textContent=t.empty}$('play').disabled=s.busy||!s.servers.some(v=>v.endpoint===selected&&v.compatible);if(s.launched){document.body.style.opacity='.3';return}}catch(e){}setTimeout(poll,800)}poll();
</script></html>
