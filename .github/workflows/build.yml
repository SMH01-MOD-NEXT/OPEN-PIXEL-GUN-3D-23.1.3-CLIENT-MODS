name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test startup clock compatibility
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itools/test_support \
            tools/test_startup_clock.cpp -o /tmp/test-startup-clock -pthread -ldl
          /tmp/test-startup-clock

      - name: Test Team Strike bot compatibility
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itools/test_support \
            tools/test_team_strike_bots.cpp -o /tmp/test-team-strike-bots -pthread -ldl
          /tmp/test-team-strike-bots

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The SDK image ships CMake 3.31.5; this port is built with 4.1.2.
      - name: Install CMake 4.1.2
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'cmake;4.1.2' > /dev/null
          test -x "$SDK/cmake/4.1.2/bin/cmake"

      - name: Build PR (assembleRelease, arm64-v8a, diagnostics off)
        if: github.event_name == 'pull_request'
        run: ./gradlew :opg3d:assembleRelease --no-daemon --stacktrace

      - name: Build trusted ref (assembleRelease, arm64-v8a)
        if: github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_OPG3D_APPID_KEY: ${{ secrets.OPG3D_APPID_KEY }}
        run: ./gradlew :opg3d:assembleRelease --no-daemon --stacktrace

      # A managed exception crossing one of our hook frames must never be
      # handed to LLVM's incompatible generic C++ personality.
      - name: Assert no LLVM C++ personality in our frames
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/ndk"
          fi
          NM="$(find "$NDK_ROOT" -type f -name 'llvm-nm' | head -n 1)"
          if [ -z "$NM" ]; then
            echo "::error::llvm-nm not found under $NDK_ROOT — fix the path in this guard"
            exit 1
          fi
          OBJS="$(find . -type f -name '*.cpp.o' \( -path '*opg3d.dir*' -o -path '*opg3d_client.dir*' \))"
          if [ -z "$OBJS" ]; then
            echo "::error::opg3d object files not found — AGP changed the layout, fix the path in this guard"
            exit 1
          fi
          echo "$OBJS"
          if echo "$OBJS" | xargs "$NM" --undefined-only | grep -q '__gxx_personality_v0'; then
            echo "::error::libopg3d frames reference __gxx_personality_v0 — restore -fno-exceptions"
            exit 1
          fi
          echo "ok: no generic-model personality in our frames"

      - name: Collect libopg3d.so
        run: |
          mkdir -p out/apk out/server
          cp lib/arm64-v8a/libopg3d.so out/apk/
          cp lib/arm64-v8a/libopg3d_client.so out/server/
          c++ -std=c++17 -Wall -Wextra -Werror tools/test_loader_policy.cpp -o /tmp/test-loader-policy
          /tmp/test-loader-policy
          ls -la out/

      - name: Upload libopg3d.so
        uses: actions/upload-artifact@v4
        with:
          name: libopg3d-arm64-v8a
          path: out/
          if-no-files-found: error
